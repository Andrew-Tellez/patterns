tag_prefix = "v"
from_latest_tag = false
ignore_merge_commits = false
ignore_fixup_commits = true
disable_changelog = false
disable_bump_commit = false
generate_mono_repository_global_tag = true
generate_mono_repository_package_tags = true
branch_whitelist = []
skip_ci = "[skip ci]"
skip_untracked = false
pre_bump_hooks = []
post_bump_hooks = []
pre_package_bump_hooks = []
post_package_bump_hooks = []

[git_hooks]

[commit_types]

[changelog]
path = "CHANGELOG.md"
authors = []

[bump_profiles]

# Per-package tags: `cog bump --auto` produces ts-vX.Y.Z / py-vX.Y.Z, which is
# what .github/workflows/release.yml triggers on. One tag publishes one package.
[packages.ts]
path = "packages/ts"
public_api = true

[packages.py]
path = "packages/py"
public_api = true

[packages.kotlin]
path = "packages/kotlin"
public_api = true

[packages.csharp]
path = "packages/csharp"
public_api = true

[packages.rust]
path = "packages/rust"
public_api = true

# No [packages.go] entry: the Go module proxy requires the tag to be prefixed with
# the module's subdirectory — packages/go/v0.1.0 — which cog's <name>-v<version>
# scheme cannot produce. Go releases are tagged by hand; see packages/go/README.md.
