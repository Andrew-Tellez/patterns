[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gof-patterns"
version = "0.1.0"
description = "GoF design patterns as small, typed helpers. You supply the domain logic; the pattern plumbing is done."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrew Tellez" }]
keywords = ["design-patterns", "gof", "state-machine", "observer", "strategy", "registry"]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Andrew-Tellez/patterns"
Source = "https://github.com/Andrew-Tellez/patterns/tree/main/packages/py"

[tool.hatch.build.targets.wheel]
packages = ["gof"]
