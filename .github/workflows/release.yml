name: release

# Tags come from cocogitto's per-package tags: `cog bump --auto` produces
# `ts-vX.Y.Z` and `py-vX.Y.Z`. Each tag publishes exactly one package.
on:
  push:
    tags:
      - 'ts-v*'
      - 'py-v*'
      - 'kotlin-v*'
      - 'csharp-v*'
      - 'rust-v*'

permissions:
  contents: read

jobs:
  npm:
    if: startsWith(github.ref, 'refs/tags/ts-v')
    name: publish gof-patterns (npm)
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    defaults:
      run:
        working-directory: packages/ts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/ts/package-lock.json
      - run: npm ci
      - name: Verify the tag matches package.json
        run: |
          tagged="${GITHUB_REF_NAME#ts-v}"
          declared="$(node -p "require('./package.json').version")"
          if [ "$tagged" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME says $tagged, package.json says $declared" >&2
            exit 1
          fi
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      # Authenticated by trusted publishing (OIDC): no token, and the 2FA
      # requirement is satisfied without one. Needs npm >= 11.5.1, which the
      # Node 24 image ships.
      - name: Publish
        run: |
          npm --version
          npm publish --provenance --access public

  pypi:
    if: startsWith(github.ref, 'refs/tags/py-v')
    name: publish gof-patterns (PyPI)
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing
    defaults:
      run:
        working-directory: packages/py
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify the tag matches pyproject.toml
        run: |
          tagged="${GITHUB_REF_NAME#py-v}"
          declared="$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          if [ "$tagged" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME says $tagged, pyproject.toml says $declared" >&2
            exit 1
          fi
      - name: Test
        run: python -m unittest discover -s tests -t .
      - name: Build
        run: |
          python -m pip install --quiet build
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/py/dist

  maven:
    if: startsWith(github.ref, 'refs/tags/kotlin-v')
    name: publish gof-patterns (Maven Central)
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/kotlin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify the tag matches build.gradle.kts
        run: |
          tagged="${GITHUB_REF_NAME#kotlin-v}"
          declared="$(grep -m1 '^version = ' build.gradle.kts | cut -d'"' -f2)"
          if [ "$tagged" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME says $tagged, build.gradle.kts says $declared" >&2
            exit 1
          fi
          echo "VERSION=$declared" >> "$GITHUB_ENV"
      - name: Test, coverage gate and build
        run: ./gradlew build
      - name: Build the signed bundle
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          ./gradlew centralBundle
          # A bundle with no signatures is rejected by Central; catch it here, with a
          # message that says which secret is missing.
          if ! unzip -l "build/distributions/central-bundle-${VERSION}.zip" | grep -q '\.asc$'; then
            echo "no .asc signatures in the bundle — is SIGNING_KEY set on the release environment?" >&2
            exit 1
          fi
      # Central has no OIDC, so this is the one publish in the repo that needs a
      # long-lived credential. publishingType=USER_MANAGED means the deployment is
      # validated and then waits for a click in the Portal — change it to AUTOMATIC
      # once you trust it. Central publishes are permanent; there is no unpublish.
      - name: Upload to the Central Portal
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          token="$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 | tr -d '\n')"
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $token" \
            -F "bundle=@build/distributions/central-bundle-${VERSION}.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=USER_MANAGED&name=gof-patterns-${VERSION}"
          echo
          echo "Deployment uploaded. Approve it at https://central.sonatype.com/publishing/deployments"

  nuget:
    if: startsWith(github.ref, 'refs/tags/csharp-v')
    name: publish gof-patterns (NuGet)
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # NuGet trusted publishing (OIDC)
    defaults:
      run:
        working-directory: packages/csharp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify the tag matches the csproj
        run: |
          tagged="${GITHUB_REF_NAME#csharp-v}"
          declared="$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' src/GofPatterns/GofPatterns.csproj | head -1)"
          if [ "$tagged" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME says $tagged, GofPatterns.csproj says $declared" >&2
            exit 1
          fi
      - name: Test
        run: dotnet test --configuration Release
      - name: Pack
        run: dotnet pack src/GofPatterns/GofPatterns.csproj --configuration Release --output artifacts
      # The temporary key is valid for one hour, so it is requested immediately
      # before the push rather than at the top of the job.
      - name: NuGet login (OIDC to a short-lived key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json

  crates:
    if: startsWith(github.ref, 'refs/tags/rust-v')
    name: publish gof-patterns (crates.io)
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing (OIDC)
    defaults:
      run:
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Verify the tag matches Cargo.toml
        run: |
          tagged="${GITHUB_REF_NAME#rust-v}"
          declared="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$tagged" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME says $tagged, Cargo.toml says $declared" >&2
            exit 1
          fi
      - name: Format, clippy and test
        run: |
          cargo fmt --check
          cargo clippy --all-targets
          cargo test
      # The official OIDC action: it fetches a temporary crates.io token and its
      # post step revokes it when the job ends, so nothing long-lived exists.
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
