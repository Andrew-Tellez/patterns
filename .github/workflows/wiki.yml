name: wiki

# The wiki is written in docs/wiki/ so it goes through review like any other
# change, then gets pushed to the GitHub wiki from here.
#
# One-time setup: the wiki must already exist. Create any page once in the
# repo's Wiki tab, otherwise the clone below has nothing to clone.
on:
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Push docs/wiki to the GitHub wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --quiet \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          rsync -a --delete --exclude '.git' docs/wiki/ wiki/
          cd wiki
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --quiet --cached; then
            echo "wiki already up to date"
            exit 0
          fi
          git commit --quiet -m "docs: sync from ${GITHUB_SHA:0:7}"
          git push --quiet
