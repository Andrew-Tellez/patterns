name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    name: ts (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ts
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/ts/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test with coverage thresholds
        run: npm run coverage
      - name: Build
        run: npm run build
      - name: Pack (catches a broken "files" or "exports")
        run: npm pack --dry-run

  py:
    name: py (${{ matrix.python }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/py
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Test with coverage thresholds
        run: |
          python -m pip install --quiet coverage
          python -m coverage run --source=gof_patterns -m unittest discover -s tests -t . -v
          python -m coverage report -m --fail-under=100
      - name: Build (catches a broken pyproject)
        run: |
          python -m pip install --quiet build
          python -m build

  kotlin:
    name: kotlin (jdk ${{ matrix.jdk }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/kotlin
    strategy:
      fail-fast: false
      matrix:
        jdk: ['17', '25']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      # The wrapper jar is committed, so verify it is the real one before running it.
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      # `build` depends on `check`, which depends on jacocoTestCoverageVerification,
      # so the coverage gate runs here.
      - name: Test, coverage gate and build
        run: ./gradlew build
      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import re, pathlib
          x = pathlib.Path("build/reports/jacoco/test/jacocoTestReport.xml").read_text()
          print("### Kotlin coverage\n")
          for kind, missed, covered in re.findall(
              r'<counter type="(LINE|BRANCH|METHOD)" missed="(\d+)" covered="(\d+)"/>', x
          )[-3:]:
              total = int(missed) + int(covered)
              print(f"- {kind.title()}: {int(covered)}/{total} = {100 * int(covered) / total:.1f}%")
          EOF

  csharp:
    name: csharp (.NET ${{ matrix.dotnet }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/csharp
    strategy:
      fail-fast: false
      matrix:
        dotnet: ['8.0.x', '10.0.x']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - name: Test
        run: dotnet test --configuration Release
      - name: Pack (catches broken package metadata)
        run: dotnet pack src/GofPatterns/GofPatterns.csproj --configuration Release

  go:
    name: go (${{ matrix.go }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/go
    strategy:
      fail-fast: false
      matrix:
        go: ['1.23', 'stable']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          # No go.sum: the module has no dependencies. setup-go hashes go.mod instead.
          cache-dependency-path: packages/go/go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt -w ."; exit 1; }
      - name: Vet
        run: go vet ./...
      # -race because Singleton, Flyweight, Bridge and Subject are meant to be
      # shared; a data race in them is the bug that matters most here.
      - name: Test with the race detector and a coverage gate
        run: |
          go test -race -coverprofile=cover.out ./...
          total="$(go tool cover -func=cover.out | awk '/^total:/ {print substr($3, 1, length($3) - 1)}')"
          echo "coverage: $total%"
          awk -v got="$total" 'BEGIN { exit !(got >= 99) }' \
            || { echo "coverage $total% is below the 99% gate" >&2; exit 1; }
      - name: Build
        run: go build ./...

  rust:
    name: rust (${{ matrix.rust }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/rust
    strategy:
      fail-fast: false
      matrix:
        rust: ['1.80', 'stable']
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust ${{ matrix.rust }}
        run: |
          rustup toolchain install ${{ matrix.rust }} --profile minimal --component clippy,rustfmt
          rustup default ${{ matrix.rust }}
      - name: Format
        run: cargo fmt --check
      # clippy::all is denied in Cargo.toml, tests included, and unsafe_code is
      # forbidden — the lints are the review, not a suggestion.
      - name: Clippy
        run: cargo clippy --all-targets
      - name: Test
        run: cargo test

  examples:
    name: examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: examples/01-singleton/go/go.mod
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # tsc lives in the TypeScript package, and so does @types/node.
      - name: Install the TypeScript toolchain
        run: npm ci
        working-directory: packages/ts
      # Each example asserts its own result, including the `before` files, which
      # assert the bug the video opens with. If one stops reproducing, the script
      # is lying and CI says so.
      - name: Run every example
        run: ./examples/run-all.sh

  videos:
    name: videos (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: videos
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: videos/package-lock.json
      - run: npm ci
      # Typecheck only. Rendering needs a headless Chrome download and minutes of
      # CPU, which is not worth it per push — the MP4s are built on demand.
      - name: Typecheck the compositions
        run: npx tsc --noEmit

  ci-ok:
    name: ci ok
    if: always()
    needs: [ts, py, kotlin, csharp, go, rust, examples, videos]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "all green"
